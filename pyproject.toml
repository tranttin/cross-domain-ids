[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ids-2026-research"
version = "0.4.6"
description = "Reproducible IDS experiments from legacy CIC-IDS notebooks to clean cross-domain research protocols."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "tensorflow>=2.15,<2.20",
  "matplotlib>=3.8,<4",
  "pyyaml>=6,<7",
  "joblib>=1.3,<2",
  "kaggle>=1.6,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
